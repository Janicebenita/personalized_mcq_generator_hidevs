
name: bloompath
version: "1.0.0"
description: >-
  BloomPath is an on-device AI-assisted educational
  practice agent that transforms English study notes
  into source-grounded multiple-choice questions.
  It provides evidence-linked answer explanations,
  adaptive practice through Recall, Connect, and
  Challenge levels, and topic-level performance
  analytics. The system uses browser-based inference
  with an explicit source-practice fallback.
